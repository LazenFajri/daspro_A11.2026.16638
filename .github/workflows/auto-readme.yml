name: Auto Update README & Task Tracker

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'index.html'
      - 'task-tracker/index.html'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run README & Tracker Generator
        run: python scripts/generate_readme.py

      - name: Commit & Push if Changes Detected
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(sync): auto-sync assignment catalog, task tracker, and statistics [skip ci]"
          file_pattern: "README.md index.html task-tracker/index.html **/info.json"

