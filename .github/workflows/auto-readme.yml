name: Auto Update README

on:
  push:
    paths:
      - 'Tugas*/**'
      - 'scripts/**'
      - '.github/workflows/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run README Generator
        run: python scripts/generate_readme.py

      - name: Commit & Push if Changes Detected
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(readme): auto-sync assignment catalog and statistics [skip ci]"
          file_pattern: "README.md"
